name: Optional mobile icon helper

on:
  push:
    paths:
      - 'tools/mobile-icons/**'
      - '.github/workflows/mobile-icons.yml'
  pull_request:
    paths:
      - 'tools/mobile-icons/**'
      - '.github/workflows/mobile-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install Pillow beautifulsoup4
      - name: Run offline resolver, provider, and installer tests
        run: python -m unittest discover -s tools/mobile-icons/tests -v
