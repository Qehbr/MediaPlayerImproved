name: Release

# Build the .plasmoid and publish a GitHub Release whenever a version tag is
# pushed (e.g. `git tag v1.3 && git push origin v1.3`). Can also be run manually
# from the Actions tab (build-only, no release) via "Run workflow".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package contents
        run: |
          python3 -c "import json; json.load(open('metadata.json'))"
          test -f contents/ui/main.qml
          test -f contents/config/main.xml
          echo "Package structure looks valid."

      - name: Check metadata version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json; print(json.load(open('metadata.json'))['KPlugin']['Version'])")
          echo "Tag version: $TAG / metadata.json version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::warning::Tag ($TAG) does not match metadata.json Version ($VER). Consider bumping the Version field."
          fi

      - name: Build .plasmoid
        run: |
          zip -r -X MediaPlayerImproved.plasmoid metadata.json contents LICENSE
          unzip -l MediaPlayerImproved.plasmoid

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerImproved
          path: MediaPlayerImproved.plasmoid

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MediaPlayerImproved.plasmoid
          generate_release_notes: true
